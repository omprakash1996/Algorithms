name: CI

on:
  push:
    branches:
      - master-to-main
      - main
  pull_request:
    branches:
      - master-to-main
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          files="$(git ls-files '*.js')"
          if [ -z "$files" ]; then
            echo "No JavaScript files found."
            exit 0
          fi

          while IFS= read -r file; do
            node --check "$file"
          done <<< "$files"